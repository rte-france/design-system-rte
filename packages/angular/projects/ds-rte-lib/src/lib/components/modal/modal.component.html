<div class="rte-modal-wrapper">
  <div
    class="rte-modal-backdrop"
    [attr.data-open]="isOpen()"
    [attr.data-interactive]="!!closeOnClickOutside()"
    (click)="handleClickBackdrop()"
  ></div>
  <dialog
    #modal
    class="rte-modal-container"
    [attr.aria-modal]="true"
    [attr.aria-labelledby]="id() + '-modal-title'"
    [attr.aria-describedby]="description() ? id() + '-modal-desc' : ariaDescribedby()"
    [attr.data-size]="size()"
    [attr.data-open]="isOpen()"
  >
    <div class="rte-modal-header">
      <div class="rte-modal-header-text">
        <rte-icon *ngIf="icon()" [name]="icon() ?? ''" [size]="iconSize()" [appearance]="iconAppearance()" />
        <h2 class="rte-modal-title" [id]="id() + '-modal-title'">
          {{ title() }}
        </h2>
        <rte-icon-button
          data-testid="modal-close-button"
          name="close"
          size="l"
          class="close-icon"
          variant="neutral"
          [ariaLabel]="'Close modal ' + id()"
          (clickEvent)="onClose()"
        />
      </div>
      <rte-divider />
    </div>
    <div *ngIf="description() || customContent()" class="rte-modal-content">
      <p *ngIf="description()" class="rte-modal-content-description" [id]="id() + '-modal-desc'">
        {{ description() }}
      </p>
      <ng-container *ngIf="customContent()" [ngTemplateOutlet]="customContent()"></ng-container>
    </div>
    @if (useConfiguredFooter()) {
      <div class="rte-modal-footer">
        @if (secondaryActionLabel()) {
          <button rteButton rteButtonVariant="neutral" type="button" (click)="secondaryActionClick.emit()">
            {{ secondaryActionLabel() }}
          </button>
        }
        @if (primaryActionType() === "split-button") {
          <rte-split-button
            [label]="primaryActionLabel() ?? ''"
            [options]="primarySplitButtonOptions()"
            [ariaLabelRight]="primarySplitButtonAriaLabelRight() ?? ''"
            (clickLeftButton)="primaryActionClick.emit()"
          />
        } @else {
          <button
            rteButton
            rteButtonAppearance="brand"
            rteButtonHierarchy="primary"
            type="button"
            [rteButtonIsCritical]="primaryActionIsCritical()"
            (click)="primaryActionClick.emit()"
          >
            {{ primaryActionLabel() }}
          </button>
        }
      </div>
    } @else {
      <div class="rte-modal-footer">
        <ng-container [ngTemplateOutlet]="secondaryButton()"></ng-container>
        <ng-container [ngTemplateOutlet]="primaryButton()"></ng-container>
      </div>
    }
  </dialog>
</div>
