@if (shouldRender()) {
  <div
    #cardElement
    class="card card-{{ cardType() }}"
    [style.width]="width()"
    [style.height]="height()"
    [attr.disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-labelledby]="ariaLabelledby()"
    [attr.role]="ariaRole() || (clickable() ? 'button' : null)"
    [ngClass]="{ clickable: clickable() }"
    [tabIndex]="tabIndex()"
    (click)="onClick()"
    (keydown)="onKeyDown($event)"
  >
    <ng-content />
  </div>
}
