<rte-icon-button
  [size]="size()"
  [name]="name()"
  [compactSpacing]="compactSpacing()"
  [disabled]="disabled()"
  [ariaLabel]="ariaLabel()"
  [ariaLabelledBy]="ariaLabelledBy()"
  [type]="type()"
  [variant]="variant()"
  [iconAppearance]="isSelected() ? 'filled' : 'outlined'"
  (clickEvent)="onClick($event)"
/>
