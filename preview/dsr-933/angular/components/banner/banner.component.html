<section
  *ngIf="rendering()"
  #banner
  class="rte-banner rte-banner-container {{ type() }} {{ position() }}"
  [ngClass]="{ open: visible(), close: !visible() }"
  [attr.role]="type() === 'error' ? 'alert' : 'status'"
  [attr.data-compact]="isCompact()"
  [attr.aria-labelledby]="title() ? titleId() : null"
  [attr.aria-describedby]="message() ? messageId() : null"
  [attr.tabindex]="-1"
>
  <div class="rte-banner-icon">
    <rte-icon [name]="iconName()" [size]="32" [ariaHidden]="true" />
  </div>
  <div class="rte-banner-content">
    <span *ngIf="title()" class="rte-banner-title" [attr.id]="titleId()">
      <span class="rte-sr-only">{{ computedBannerTypeLabel() }} </span>{{ title() }}
    </span>
    <div *ngIf="message()" class="rte-banner-message" [attr.id]="messageId()">
      <span>{{ message() }}</span>
    </div>
  </div>
  <button
    *ngIf="actionLabel()"
    rteButton
    rteButtonVariant="text"
    [rteButtonSize]="actionButtonSize()"
    [attr.aria-label]="actionLabel()!"
    (click)="clickAction()"
  >
    {{ actionLabel() }}
  </button>
  <button
    *ngIf="isClosable()"
    type="button"
    class="rte-banner-close-icon rte-icon-button neutral size-m compact-spacing"
    [attr.aria-label]="closeButtonAriaLabel"
    (click)="closeBanner()"
  >
    <rte-icon name="close" [size]="20" />
  </button>
</section>
