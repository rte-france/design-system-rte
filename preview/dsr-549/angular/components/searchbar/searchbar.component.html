<div class="searchbar-container" role="search" [ngClass]="appearance()" [style.width]="width()">
  <div
    class="text-input-wrapper"
    [attr.data-disabled]="isDisabled()"
    (focusin)="handleFocusIn()"
    (focusout)="handleFocusOut($event)"
  >
    <rte-base-text-input
      rightIconAction="clean"
      autocomplete="off"
      [width]="width()"
      [id]="id() ?? ''"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [value]="internalValue()"
      [showRightIcon]="showResetButton()"
      [assistiveTextLabel]="assistiveText()"
      [compactSpacing]="compactSpacing()"
      [leftIcon]="appearanceConfig().showLeftIcon ? 'search' : null"
      [customStyle]="textInputStyles()"
      [highlighted]="hasFocusWithin()"
      (valueChange)="handleChange($event)"
      (rightIconClick)="handleClear()"
    >
      @if (appearanceConfig().showSearchButton) {
        <rte-icon-button
          baseTextInputRightSlot
          name="search"
          size="m"
          variant="primary"
          appearance="filled"
          class="search-button"
          [ariaLabel]="label()"
          [disabled]="isDisabled()"
          [compactSpacing]="compactSpacing()"
          [customStyle]="searchButtonStyles()"
          (clickEvent)="handleSearch()"
        />
      }
    </rte-base-text-input>
  </div>
</div>
