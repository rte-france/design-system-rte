@if (effectiveRouterLink()) {
  <a
    class="rte-link"
    role="link"
    [routerLink]="effectiveRouterLink()!"
    [queryParams]="routerLinkConfig()?.queryParams"
    [fragment]="routerLinkConfig()?.fragment"
    [queryParamsHandling]="routerLinkConfig()?.queryParamsHandling"
    [preserveFragment]="routerLinkConfig()?.preserveFragment"
    [replaceUrl]="routerLinkConfig()?.replaceUrl"
    [state]="routerLinkConfig()?.state"
    [ngClass]="{ subtle: subtle(), reverse: reverse(), 'rte-link--truncate': maxWidth() !== null }"
    [style.max-width.px]="maxWidth()"
  >
    <span
      class="rte-link-label"
      [class.rte-link-label--truncate]="maxWidth() !== null"
      [style.max-width.px]="maxWidth()"
    >
      {{ label() }}
    </span>
  </a>
} @else {
  <a
    class="rte-link"
    role="link"
    [href]="href()"
    [ngClass]="{ subtle: subtle(), reverse: reverse(), 'rte-link--truncate': maxWidth() !== null }"
    [attr.target]="externalLink() ? '_blank' : null"
    [attr.rel]="externalLink() ? 'noopener noreferrer' : null"
    [style.max-width.px]="maxWidth()"
  >
    <span
      class="rte-link-label"
      [class.rte-link-label--truncate]="maxWidth() !== null"
      [style.max-width.px]="maxWidth()"
    >
      {{ label() }}
    </span>
    <rte-icon
      *ngIf="externalLink()"
      name="external-link"
      style="align-self: start; margin-left: 2px"
      [size]="12"
    ></rte-icon>
  </a>
}
