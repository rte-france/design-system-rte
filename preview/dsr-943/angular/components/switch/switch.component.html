<div
  class="switch-container appearance-{{ appearance() }}"
  [ngClass]="{
    disabled: isDisabled(),
    'read-only': readOnly(),
    checked: isChecked(),
  }"
  (click)="handleClick($event)"
>
  <input
    type="checkbox"
    role="switch"
    class="switch"
    [id]="computedSwitchId()"
    [attr.aria-checked]="isChecked()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-disabled]="isDisabled()"
    [attr.aria-labelledby]="ariaLabelledBy()"
    [attr.aria-readonly]="readOnly()"
    [ariaLabel]="label()"
    [name]="label()"
    [ngClass]="{
      disabled: isDisabled(),
      'read-only': readOnly(),
      checked: isChecked(),
    }"
    [style.min-height.px]="switchHeight"
    [style.min-width.px]="switchWidth"
    [disabled]="isDisabled()"
    [checked]="isChecked()"
    (change)="handleChange($event)"
  />
  <div class="switch-icon-check" [ngClass]="{ checked: isChecked() }" (click)="handleClick($event)">
    @if (showIcon()) {
      <rte-icon
        class="icon"
        [name]="isChecked() ? 'check' : 'close'"
        [size]="16"
        (click)="handleClick($event)"
      ></rte-icon>
    }
  </div>
  @if (label()) {
    <label class="switch-label" [for]="computedSwitchId()">
      {{ label() }}
    </label>
  }
</div>
