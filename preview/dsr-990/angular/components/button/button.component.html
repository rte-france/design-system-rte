@if (rteButtonIcon() && rteButtonIconPosition() === "left") {
  <rte-icon
    [name]="rteButtonIcon()!"
    [appearance]="rteButtonIconAppearance()"
    [size]="iconSize()!"
    [ariaHidden]="true"
  ></rte-icon>
}
<span class="rte-button-label">
  <ng-content />
</span>
@if (rteButtonIcon() && rteButtonIconPosition() === "right") {
  <rte-icon
    [name]="rteButtonIcon()!"
    [appearance]="rteButtonIconAppearance()"
    [size]="iconSize()!"
    [ariaHidden]="true"
  ></rte-icon>
}
